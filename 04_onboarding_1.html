
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Planeja+</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Adicionar link para Font Awesome se for usar ícones -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
    <style>
        /* Estilos específicos para esta tela de onboarding, se necessário */
        body {
            background-color: var(--cor-azul-escuro); /* Fundo azul escuro */
            color: var(--cor-branco);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .onboarding-container {
            display: flex;
            align-items: center;
            justify-content: space-around; /* Ou 'space-between' */
            width: 100%;
            max-width: 900px; /* Ajuste a largura máxima */
            padding: 40px;
        }
        .onboarding-text {
            max-width: 45%;
            text-align: left;
        }
        .onboarding-text h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        .onboarding-text p {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-seguinte { /* Estilo similar ao btn-principal mas pode ser customizado */
            background-color: var(--cor-laranja);
            color: var(--cor-branco);
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-block; /* Para que padding funcione corretamente */
            transition: background-color 0.2s ease;
        }
         .btn-seguinte:hover {
            background-color: #e06c30;
        }

        .onboarding-illustration {
            max-width: 45%;
            text-align: center; /* Para centralizar a imagem/placeholder */
        }
        .illustration-placeholder {
            background-color: var(--cor-branco); /* Caixa branca como no mockup */
            padding: 30px;
            border-radius: 15px;
            /* Adicionar estilos para a imagem ou um placeholder */
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cor-texto-padrao); /* Cor para texto do placeholder */
        }
        .illustration-placeholder img {
             max-width: 100%;
             height: auto;
        }

    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="onboarding-text">
            <h1>Bem vindo ao planeja+</h1>
            <p>Vamos te ajudar a organizar suas finanças de maneira simples e eficiente.</p>
            <a href="05_onboarding_2.html" class="btn-seguinte">Seguinte &gt;</a>
        </div>
        <div class="onboarding-illustration">
            <div class="illustration-placeholder">
                <!-- Aqui entraria a imagem da ilustração -->
                <!-- Exemplo com texto: -->
                <span>[Ilustração: Pessoa apontando para gráfico com moedas]</span>
                 <!-- Exemplo com img tag (substituir src):
                 <img src="img/onboarding-illustration-1.png" alt="Ilustração de organização financeira">
                 -->
            </div>
        </div>
    </div>
</body>
</html>
