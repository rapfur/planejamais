
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Transação - Planeja+</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Adicionar link para Font Awesome se for usar ícones -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
    <style>
        /* Estilo adicional para centralizar o form ou ajustar layout */
        .form-container {
            max-width: 600px; /* Ou outra largura desejada */
            margin: 0 auto; /* Centraliza se for a única coisa na página */
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral (Repetido para manter layout consistente) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="img/logo-planeja.png" alt="Logo Planeja+">
            </div>
            <nav>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="transacoes.html" class="active">Transações</a></li> <!-- Mantém Transações ativo -->
                    <li><a href="contas_cartoes.html">Contas e Cartões</a></li>
                    <li><a href="dividas.html">Dívidas</a></li>
                    <li><a href="metas.html">Metas</a></li>
                    <li><a href="educacao_financeira.html">Educação Financeira</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-footer-icons">
                    <a href="perfil.html" title="Perfil">👤</a>
                    <a href="configuracoes.html" title="Configurações">⚙️</a>
                </div>
                <div class="sidebar-copyright">
                    Planeja+<br>
                    Copyright 2025
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal: Formulário -->
        <main class="main-content">
            <header class="main-header">
                 <h1>Adicionar Nova Transação</h1>
                 <a href="transacoes.html" style="text-decoration: none; color: var(--cor-cinza-texto);">Voltar</a>
            </header>

            <section class="content-section">
                <div class="form-container">
                    <form action="#" method="post"> <!-- Substituir # pela URL de ação do backend -->
                        <div class="form-group">
                            <label for="tipo">Tipo:</label>
                            <select id="tipo" name="tipo" required>
                                <option value="despesa">Despesa</option>
                                <option value="receita">Receita</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="descricao">Descrição:</label>
                            <input type="text" id="descricao" name="descricao" placeholder="Ex: Supermercado, Salário" required>
                        </div>
                         <div class="form-group">
                            <label for="valor">Valor (R$):</label>
                            <input type="number" step="0.01" id="valor" name="valor" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="data">Data:</label>
                            <input type="date" id="data" name="data" required>
                        </div>
                         <div class="form-group">
                            <label for="categoria">Categoria:</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">Selecione</option>
                                <option value="alimentacao">Alimentação</option>
                                <option value="transporte">Transporte</option>
                                <option value="moradia">Moradia</option>
                                <option value="lazer">Lazer</option>
                                <option value="saude">Saúde</option>
                                <option value="educacao">Educação</option>
                                <option value="salario">Salário</option>
                                <option value="investimentos">Investimentos</option>
                                <option value="outros">Outros</option>
                                <!-- Adicionar mais categorias ou carregar dinamicamente -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="conta_cartao">Conta/Cartão (Origem/Destino):</label>
                             <select id="conta_cartao" name="conta_cartao" required>
                                 <option value="">Selecione</option>
                                 <!-- Carregar contas e cartões cadastrados dinamicamente aqui -->
                                 <option value="conta1">Conta Corrente - Banco X</option>
                                 <option value="cartao1">Cartão Crédito - Nu</option>
                                 <option value="dinheiro">Dinheiro</option>
                             </select>
                        </div>
                         <div class="form-group">
                            <label for="parcelas">Parcelamento (Opcional):</label>
                            <input type="text" id="parcelas" name="parcelas" placeholder="Ex: 1 de 10, 3 de 12">
                            <small style="color: var(--cor-cinza-texto); font-size: 0.8em;">Preencha apenas se for uma compra parcelada.</small>
                        </div>
                        <button type="submit" class="btn-principal">Salvar Transação</button>
                    </form>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
