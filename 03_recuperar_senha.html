
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Planeja+</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Adicionar link para Font Awesome se for usar ícones -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
</head>
<body>
    <div class="auth-container">
        <header class="auth-header">
            <img src="img/logo-planeja.png" alt="Logo Planeja+" class="auth-logo">
        </header>

        <main class="auth-main">
            <div class="auth-box">
                <h2>Recuperar Senha</h2>
                <p>Digite seu e-mail abaixo para receber o link de recuperação de senha.</p>

                <form action="#" method="post"> <!-- Substituir # pela URL de ação do backend -->
                    <div class="form-group">
                        <input type="email" id="email_recuperacao" name="email_recuperacao" placeholder="E-mail" required>
                    </div>
                    <button type="submit" class="btn-principal">Enviar Link</button>
                </form>

                <div class="auth-links">
                     <a href="index.html">Voltar para Login</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
